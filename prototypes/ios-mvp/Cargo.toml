# The smallest proof that our GPUI draws and takes a touch on iOS.
# Its own workspace: the app's build is untouched.
[package]
name = "fireflies-ios-mvp"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.8", features = ["runtime_shaders"] }

[patch.crates-io]
gpui-pre = { path = "../../vendor/gpui-pre" }
gpui-pre-apple = { path = "../../vendor/gpui-pre-apple" }
taffy = { path = "../../vendor/taffy" }

[workspace]
