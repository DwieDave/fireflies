# The smallest proof that our GPUI draws and takes a touch on iOS.
# Its own workspace: the app's build is untouched.
[package]
name = "fireflies-ios-mvp"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui-shell = { path = "../../vendor/gpui-kit/crates/shell" }
# quickjs-jit ships no prebuilt bindings for the iOS targets: generate them.
quickjs-jit-sys = { version = "0.12.11", git = "https://github.com/longbridge/quickjs-jit", rev = "96593cd7a54440ac060a391b8baea7e9a3cf1393", features = ["bindgen"] }
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.8", features = ["runtime_shaders"] }

[patch.crates-io]
gpui-pre = { path = "../../vendor/gpui-pre" }
gpui-pre-apple = { path = "../../vendor/gpui-pre-apple" }
taffy = { path = "../../vendor/taffy" }
# HERDR: an iOS branch in current_platform (only this prototype uses it).
gpui-pre-platform = { path = "patches/gpui-pre-platform" }
rquickjs = { path = "../../vendor/gpui-kit/crates/shell/rquickjs-compat" }

[patch."https://github.com/longbridge/quickjs-jit"]
quickjs-jit-runtime = { path = "../../vendor/quickjs-jit-runtime" }

[workspace]
